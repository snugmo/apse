# apse CI.
#
# The single job does, in this order:
#
# 1. `cargo check --all-targets --locked` — compiles the whole graph
#    (which extracts the cargo-registry sources the table generator
#    reads) and, as a side effect, is the sync check for
#    src/proxy/wlr_tables.rs: that file is a
#    wayland_scanner::generate_interfaces! expansion over the vendored
#    protocols/*.xml, rebuilt by the compiler on every build, so a
#    protocol-XML change that breaks or alters the table is caught
#    here, not by a file diff.
#
# 2. `python3 scripts/gen_interface_table.py` + `git diff --exit-code`
#    on the output — the sync check for src/proxy/interfaces.rs (the
#    *static* name -> Interface table; that one is a checked-in file,
#    so it is diffed instead of recompiled). If a protocol XML (in
#    wayland-protocols, in wayland-client's wayland.xml, or vendored
#    under protocols/) adds or renames an interface and the table is
#    not regenerated, this step fails the build.
#
# 3. the usual gates: rustfmt, clippy (deny warnings), the test suite.
#
# The test step needs one environment tweak first: Ubuntu 24.04+
# (the `ubuntu-latest` runner is 26.04) enables
# kernel.apparmor_restrict_unprivileged_userns=1 by default, which
# lets an unprivileged process create a user namespace but denies
# its setgroups write — the sandbox cannot map its uid/gid.
# Without the tweak the 14 hard-asserting sandbox tests fail; with
# the new probe-and-skip guards they would skip cleanly instead,
# but a silently skipped sandbox suite makes this CI meaningless,
# so we enable the namespaces on the runner rather than accept the
# skip.
#
# Runs on pushes to main only (no other branches, no pull requests):
# this is a single-developer repo, so the main push is the merge
# point and the gate for it.

name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Compile (extracts the registry sources the generator reads; builds the wlr tables)
        run: cargo check --all-targets --locked

      - name: Regenerate the proxy interface table
        run: python3 scripts/gen_interface_table.py

      - name: Fail if the checked-in table has drifted
        run: git diff --exit-code -- src/proxy/interfaces.rs

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Enable unprivileged user namespaces for the sandbox tests
        # Ubuntu's AppArmor restriction (on by default since 24.04)
        # denies the setgroups write of a fresh unprivileged userns,
        # which the sandbox's single-extent uid/gid map needs. Hard
        # on purpose: if a future runner image ever drops this sysctl,
        # we want a loud red build, not a silently skipped sandbox
        # suite. (The tests themselves also probe and skip when the
        # environment refuses, for non-Ubuntu machines.)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        # Single-threaded on purpose: several tests mutate the process
        # environment (`std::env::set_var`/`remove_var` — C `setenv`/
        # `unsetenv`) to exercise socket activation and the CLI, and
        # those are undefined behaviour when any *other* test thread
        # reads the environment concurrently (`temp_dir`, xdg, clap
        # `getenv`). Single-threading removes the race; the suite is
        # already dominated by the SANDBOX_LOCK-serialised sandbox
        # tests, so it costs ~nothing (see LESSONS.md, the
        # fork/thread-info entry and the env-mutation entry).
        run: cargo test --locked -- --test-threads=1
