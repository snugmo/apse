[package]
name = "apse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
libc = "0.2"
log = "0.4.34"
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
nono = { version = "0.81.0", default-features = false }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1"
rustix = { version = "1", features = ["event", "fs", "net"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "net", "time", "fs", "io-util"] }
wayland-backend = "0.3"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-scanner = "0.31"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3"
wayland-server = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "server"] }
